---
applications:
  - name: buzz-workshop-agent
    buildpacks: [agent_buildpack]
    stack: ((agent-stack))
    memory: 1G
    disk_quota: 2G
    instances: 1
    health-check-type: http
    health-check-http-endpoint: /health
    timeout: 180
    routes:
      - route: ((route-prefix))-agent.((domain))
    services: [buzz-workshop-ai, buzz-workshop-sso, buzz-workshop-credentials, buzz-workshop-receipt-mcp]
    env:
      TANZU_AGENT_BASE_URL: https://((route-prefix))-agent.((domain))
      TANZU_AGENT_DISPLAY_NAME: Workshop Credential Companion
      TANZU_AGENT_DESCRIPTION: Synthetic per-user Credential Store workshop
      TANZU_AGENT_GENAI_MODEL_NAME: ((model))
      TANZU_AGENT_SSO_SERVICE_LABEL: p-identity
      TANZU_AGENT_AUTH_ENFORCE_API: "true"
      TANZU_AGENT_AUTH_A2A_PROTECTED: "true"
      TANZU_AGENT_AUTH_OAUTH_SCOPES: openid
      TANZU_AGENT_ALLOW_TOKEN_ENDPOINT: "false"
      TANZU_AGENT_ENABLE_ADMIN_UI: "false"
      TANZU_AGENT_ENABLE_DEBUG_UI: "false"
      TANZU_AGENT_SHELL_ACCESS_ENABLED: "false"
      TANZU_AGENT_FILESYSTEM_ACCESS: "off"
      TANZU_AGENT_TOOL_PERMISSION_MODE: deny
      APP_ALLOWED_EMAILS: ((allowed-emails))
      SSO_SCOPES: openid
      SSO_AUTO_APPROVED_SCOPES: openid
      SSO_IDENTITY_PROVIDERS: ((sso-provider))
      SSO_REDIRECT_URIS: https://((route-prefix))-agent.((domain))/oauth2/callback,https://((route-prefix))-agent.((domain))/api/auth/callback
