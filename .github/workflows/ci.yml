name: Reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [apps/identity, apps/agent, apps/pilot-mcp, apps/workshop-mcp, integrations/agent, integrations/cf-mtls]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.directory }}
      - run: npm test
        working-directory: ${{ matrix.directory }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.directory }}
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix apps/identity
      - run: node --test scripts/test/*.test.mjs apps/relay/bindings.test.mjs
      - run: git diff --check
      - run: |
          for file in scripts/*.sh apps/workshop-agent/runtime/launch.sh; do bash -n "$file"; done
  identity-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: identity_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: apps/identity
      - run: node --test test/postgres.integration.test.mjs
        working-directory: apps/identity
        env:
          TEST_DATABASE_URL: postgres://postgres:disposable-ci-only@localhost:5432/identity_test
  worker-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --prefix apps/agent
      - run: scripts/test-worker-postgres.sh
